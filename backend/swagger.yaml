openapi: 3.0.3
info:
  title: YourEvent API
  version: 1.0.0
  description: Organizer and Provider REST API. Use Authorize with JWT token.
servers:
- url: http://localhost:3000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Register:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum:
          - organizer
          - provider
    Login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string
        bio:
          type: string
        businessName:
          type: string
        workingCities:
          type: array
          items:
            type: string
    PasswordUpdate:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    Event:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        city:
          type: string
        address:
          type: string
        budget:
          type: number
        expectedGuests:
          type: integer
        coverImage:
          type: string
        status:
          type: string
          enum:
          - planning
          - completed
          - cancelled
    Task:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean
        dueDate:
          type: string
          format: date
    Expense:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        amount:
          type: number
    Guest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - invited
          - going
          - declined
    Invitation:
      type: object
      properties:
        title:
          type: string
        message:
          type: string
        theme:
          type: string
          enum:
          - classic
          - soft
          - dark
        published:
          type: boolean
    RSVP:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - going
          - declined
    RSVPUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - going
          - declined
    Service:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        description:
          type: string
        city:
          type: string
        price:
          type: number
        images:
          type: array
          items:
            type: string
        active:
          type: boolean
    ConversationCreate:
      type: object
      properties:
        providerId:
          type: integer
    Message:
      type: object
      properties:
        body:
          type: string
paths:
  /health:
    get:
      tags:
      - System
      summary: Health check
      responses:
        '200':
          description: Success
        '201':
          description: Created
        '204':
          description: Deleted
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /auth/register:
    post:
