<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.themeScope = (['/', '/login', '/register'].includes(window.location.pathname) || /^\/(organizer|provider)(\/|$)/.test(window.location.pathname)) ? 'app' : 'public';
      try {
        document.documentElement.dataset.theme = localStorage.getItem('yourevent-theme') === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
